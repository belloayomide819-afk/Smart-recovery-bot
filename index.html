<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Recovery Bot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      background: #334155;
      margin-bottom: 15px;
    }

    .connected {
      background: #14532d;
      color: #bbf7d0;
    }

    .disconnected {
      background: #7f1d1d;
      color: #fecaca;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #475569;
      border-radius: 9px;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .connect {
      background: #2563eb;
      color: white;
    }

    .start {
      background: #16a34a;
      color: white;
    }

    .stop {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      background: #0f172a;
      padding: 14px;
      border-radius: 10px;
    }

    .stat small {
      display: block;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .stat strong {
      font-size: 20px;
    }

    .log {
      background: #020617;
      border-radius: 10px;
      padding: 12px;
      height: 240px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }

    .warning {
      color: #fbbf24;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Smart Recovery Bot</h1>

  <div class="subtitle">
    Deriv DIGITDIFF • R_25 • DEMO TEST MODE
  </div>

  <div id="connectionStatus" class="status disconnected">
    NOT CONNECTED
  </div>

  <div class="card">

    <button id="connectBtn" class="connect">
      Connect Deriv Demo
    </button>

    <div class="stats">

      <div class="stat">
        <small>Balance</small>
        <strong id="balance">$0.00</strong>
      </div>

      <div class="stat">
        <small>Session P/L</small>
        <strong id="sessionPL">$0.00</strong>
      </div>

      <div class="stat">
        <small>Trades</small>
        <strong id="trades">0</strong>
      </div>

      <div class="stat">
        <small>Mode</small>
        <strong>DEMO</strong>
      </div>

    </div>

  </div>

  <div class="card">

    <h3>Bot Configuration</h3>

    <label>Initial Stake (USD)</label>
    <input
      id="initialStake"
      type="number"
      value="0.35"
      min="0.35"
      step="0.01"
    >

    <label>Take Profit (USD)</label>
    <input
      id="takeProfit"
      type="number"
      value="0.04"
      min="0.01"
      step="0.01"
    >

    <label>Session Stop Loss (USD)</label>
    <input
      id="stopLoss"
      type="number"
      value="0.70"
      min="0.35"
      step="0.01"
    >

    <label>Recovery Multiplier</label>
    <input
      id="multiplier"
      type="number"
      value="1.5"
      min="1"
      step="0.1"
    >

    <label>Maximum Recovery Stake (USD)</label>
    <input
      id="maxRecovery"
      type="number"
      value="0.70"
      min="0.35"
      step="0.01"
    >

    <label>Prediction Digit</label>
    <input
      id="prediction"
      type="number"
      value="5"
      min="0"
      max="9"
      step="1"
    >

    <button
      id="startBtn"
      class="start"
      disabled
    >
      Start Bot
    </button>

    <button
      id="stopBtn"
      class="stop"
      disabled
    >
      Stop Bot
    </button>

    <p class="warning">
      DEMO ONLY. Real-account trading is disabled by this dashboard.
      Recovery is limited by the session stop-loss and maximum recovery stake.
    </p>

  </div>

  <div class="card">

    <h3>Bot Log</h3>

    <div id="log" class="log"></div>

  </div>

</div>

<script>

const BACKEND =
  "https://smart-recovery-bot.onrender.com";

const MIN_STAKE = 0.35;

let connected = false;
let running = false;
let ws = null;

let sessionPL = 0;
let tradeCount = 0;

let currentStake = MIN_STAKE;
let recoveryMode = false;

let config = {};

let connectionCheckTimer = null;

let waitingForResult = false;


/* ELEMENTS */

const connectionStatus =
  document.getElementById("connectionStatus");

const connectBtn =
  document.getElementById("connectBtn");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const balanceEl =
  document.getElementById("balance");

const sessionPLEl =
  document.getElementById("sessionPL");

const tradesEl =
  document.getElementById("trades");

const logEl =
  document.getElementById("log");


/* LOG */

function log(message) {

  const time =
    new Date().toLocaleTimeString();

  logEl.textContent +=
    `[${time}] ${message}\n`;

  logEl.scrollTop =
    logEl.scrollHeight;
}


/* MONEY */

function money(value) {

  return Number(value || 0).toFixed(2);
}


/* STATS */

function updateStats() {

  sessionPLEl.textContent =
    "$" + money(sessionPL);

  tradesEl.textContent =
    tradeCount;
}


/* CONNECTION */

async function connectDeriv() {

  connectBtn.disabled = true;

  log("Opening Deriv authorization...");

  window.location.href =
    BACKEND + "/login";
}


/* CHECK CONNECTION */

async function checkConnection() {

  try {

    const response =
      await fetch(
        BACKEND + "/api/status",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (data.connected) {

      if (!connected) {

        log("Deriv account connected.");

      }

      connected = true;

      connectionStatus.textContent =
        "DERIV CONNECTED";

      connectionStatus.className =
        "status connected";

      connectBtn.disabled = false;

      startBtn.disabled = running;

      await loadBalance();

    } else {

      connected = false;

      connectionStatus.textContent =
        "NOT CONNECTED";

      connectionStatus.className =
        "status disconnected";

      startBtn.disabled = true;
    }

  } catch (error) {

    /*
      Do not spam the log every few seconds.
      Only show backend errors when needed.
    */

    if (!connected) {

      connectionStatus.textContent =
        "BACKEND UNAVAILABLE";

      connectionStatus.className =
        "status disconnected";
    }
  }
}


/* BALANCE */

async function loadBalance() {

  try {

    const response =
      await fetch(
        BACKEND + "/api/balance",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.accounts
    ) {

      return;
    }

    const demoAccount =
      data.accounts.find(
        account =>
          String(
            account.account_type
          ).toLowerCase() === "demo"
      );

    if (!demoAccount) {

      return;
    }

    const balance =
      Number(
        demoAccount.balance ??
        demoAccount.amount ??
        0
      );

    balanceEl.textContent =
      "$" + money(balance);

  } catch (error) {

    /* Ignore balance polling errors. */
  }
}


/* CONFIG */

function getConfig() {

  const initialStake =
    Number(
      document.getElementById(
        "initialStake"
      ).value
    );

  const takeProfit =
    Number(
      document.getElementById(
        "takeProfit"
      ).value
    );

  const stopLoss =
    Number(
      document.getElementById(
        "stopLoss"
      ).value
    );

  const multiplier =
    Number(
      document.getElementById(
        "multiplier"
      ).value
    );

  const maxRecovery =
    Number(
      document.getElementById(
        "maxRecovery"
      ).value
    );

  const prediction =
    Number(
      document.getElementById(
        "prediction"
      ).value
    );


  if (
    !Number.isFinite(initialStake) ||
    initialStake < MIN_STAKE
  ) {

    alert(
      "Initial stake must be at least $0.35."
    );

    return null;
  }


  if (
    !Number.isFinite(takeProfit) ||
    takeProfit <= 0
  ) {

    alert(
      "Take profit must be greater than $0."
    );

    return null;
  }


  if (
    !Number.isFinite(stopLoss) ||
    stopLoss < initialStake
  ) {

    alert(
      "Stop loss must be at least $0.35 and at least the initial stake."
    );

    return null;
  }


  if (
    !Number.isFinite(multiplier) ||
    multiplier < 1
  ) {

    alert(
      "Recovery multiplier must be at least 1."
    );

    return null;
  }


  if (
    !Number.isFinite(maxRecovery) ||
    maxRecovery < MIN_STAKE
  ) {

    alert(
      "Maximum recovery stake must be at least $0.35."
    );

    return null;
  }


  if (
    prediction < 0 ||
    prediction > 9 ||
    !Number.isInteger(prediction)
  ) {

    alert(
      "Prediction digit must be between 0 and 9."
    );

    return null;
  }


  return {
    initialStake,
    takeProfit,
    stopLoss,
    multiplier,
    maxRecovery,
    prediction
  };
}


/* DEMO ACCOUNT */

async function getDemoAccount() {

  const response =
    await fetch(
      BACKEND + "/api/balance",
      {
        cache: "no-store"
      }
    );

  const data =
    await response.json();

  if (
    !response.ok ||
    !data.accounts
  ) {

    throw new Error(
      "Unable to retrieve Deriv accounts."
    );
  }

  const demo =
    data.accounts.find(
      account =>
        String(
          account.account_type
        ).toLowerCase() === "demo"
    );

  if (!demo) {

    throw new Error(
      "No demo account found."
    );
  }

  return demo;
}


/* TRADING URL */

async function getTradingURL(accountId) {

  const response =
    await fetch(
      BACKEND + "/api/trading-url",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          account_id:
            accountId
        })
      }
    );

  const data =
    await response.json();

  if (!response.ok) {

    throw new Error(
      data.error ||
      "Unable to create trading connection."
    );
  }

  if (!data.websocket_url) {

    throw new Error(
      "Deriv did not return a WebSocket URL."
    );
  }

  return data.websocket_url;
}


/* START BOT */

async function startBot() {

  if (running) {

    return;
  }

  config =
    getConfig();

  if (!config) {

    return;
  }

  try {

    log("Checking demo account...");

    const account =
      await getDemoAccount();

    if (
      String(
        account.account_type
      ).toLowerCase() !== "demo"
    ) {

      throw new Error(
        "DEMO TEST MODE: Real trading is disabled."
      );
    }

    log(
      "Demo account confirmed."
    );

    const websocketURL =
      await getTradingURL(
        account.account_id
      );

    log(
      "Opening Deriv trading connection..."
    );

    ws =
      new WebSocket(
        websocketURL
      );


    ws.onopen = () => {

      running = true;

      waitingForResult = false;

      sessionPL = 0;

      tradeCount = 0;

      currentStake =
        config.initialStake;

      recoveryMode = false;

      updateStats();

      startBtn.disabled = true;

      stopBtn.disabled = false;

      log(
        "BOT STARTED."
      );

      log(
        "Stake: $" +
        money(config.initialStake)
      );

      log(
        "Take Profit: +$" +
        money(config.takeProfit)
      );

      log(
        "Stop Loss: -$" +
        money(config.stopLoss)
      );

      log(
        "Max Recovery: $" +
        money(config.maxRecovery)
      );

      requestProposal();
    };


    ws.onmessage =
      event => {

        try {

          const data =
            JSON.parse(
              event.data
            );

          handleMessage(data);

        } catch (error) {

          log(
            "Invalid WebSocket message."
          );
        }
      };


    ws.onerror = () => {

      log(
        "WebSocket error."
      );
    };


    ws.onclose = () => {

      if (running) {

        log(
          "WebSocket closed."
        );

        stopBot(false);
      }
    };


  } catch (error) {

    log(
      "START ERROR: " +
      error.message
    );

    startBtn.disabled =
      !connected;

    stopBtn.disabled = true;
  }
}


/* REQUEST PROPOSAL */

function requestProposal() {

  if (
    !running ||
    !ws ||
    ws.readyState !== WebSocket.OPEN
  ) {

    return;
  }


  if (
    sessionPL >=
    config.takeProfit
  ) {

    log(
      "TAKE PROFIT REACHED: +$" +
      money(sessionPL)
    );

    stopBot();

    return;
  }


  if (
    sessionPL <=
    -config.stopLoss
  ) {

    log(
      "STOP LOSS REACHED: -$" +
      money(Math.abs(sessionPL))
    );

    stopBot();

    return;
  }


  const remainingLossBudget =
    config.stopLoss + sessionPL;


  if (
    remainingLossBudget <
    MIN_STAKE
  ) {

    log(
      "Remaining loss budget is below the $0.35 minimum stake."
    );

    log(
      "Bot stopped safely."
    );

    stopBot();

    return;
  }


  let stake =
    Number(currentStake);


  if (
    !Number.isFinite(stake) ||
    stake < MIN_STAKE
  ) {

    stake =
      MIN_STAKE;
  }


  if (
    stake >
    remainingLossBudget
  ) {

    log(
      "Next stake $" +
      money(stake) +
      " exceeds remaining loss budget $" +
      money(remainingLossBudget) +
      "."
    );

    log(
      "Recovery blocked. Bot stopped safely."
    );

    stopBot();

    return;
  }


  waitingForResult = true;


  log(
    (
      recoveryMode
        ? "RECOVERY"
        : "NORMAL"
    ) +
    " TRADE | Stake $" +
    money(stake)
  );


  ws.send(
    JSON.stringify({

      proposal: 1,

      amount:
        stake,

      basis:
        "stake",

      contract_type:
        "DIGITDIFF",

      currency:
        "USD",

      duration:
        1,

      duration_unit:
        "t",

      barrier:
        String(
          config.prediction
        ),

      underlying_symbol:
        "R_25",

      subscribe:
        1

    })
  );
}


/* HANDLE DERIV MESSAGE */

function handleMessage(data) {

  if (data.error) {

    log(
      "DERIV ERROR: " +
      (
        data.error.message ||
        "Unknown error"
      )
    );

    waitingForResult = false;

    stopBot();

    return;
  }


  if (
    data.msg_type ===
    "proposal"
  ) {

    const proposal =
      data.proposal;

    if (!proposal) {

      log(
        "Proposal response missing."
      );

      stopBot();

      return;
    }


    const proposalId =
      proposal.id;

    if (!proposalId) {

      log(
        "No proposal ID received."
      );

      stopBot();

      return;
    }


    const askPrice =
      Number(
        proposal.ask_price
      );


    log(
      "Proposal received."
    );


    /*
      Buy the exact proposal.
      Deriv's current API accepts the proposal ID
      and purchase price.
    */

    ws.send(
      JSON.stringify({

        buy:
          proposalId,

        price:
          Number.isFinite(askPrice)
            ? askPrice
            : Number(currentStake),

        req_id:
          Date.now()

      })
    );

    return;
  }


  if (
    data.msg_type ===
    "buy"
  ) {

    const buy =
      data.buy;

    if (!buy) {

      log(
        "Buy response missing."
      );

      stopBot();

      return;
    }


    const contractId =
      buy.contract_id;

    if (!contractId) {

      log(
        "No contract ID received."
      );

      stopBot();

      return;
    }


    log(
      "TRADE OPENED | Contract #" +
      contractId
    );


    ws.send(
      JSON.stringify({

        proposal_open_contract:
          1,

        contract_id:
          contractId,

        subscribe:
          1

      })
    );

    return;
  }


  if (
    data.msg_type ===
    "proposal_open_contract"
  ) {

    const contract =
      data.proposal_open_contract;

    if (!contract) {

      return;
    }


    const isSold =
      Number(
        contract.is_sold
      ) === 1;


    if (!isSold) {

      return;
    }


    waitingForResult = false;

    processResult(
      contract
    );
  }
}


/* PROCESS RESULT */

function processResult(contract) {

  tradeCount++;


  const profitValue =
    Number(
      contract.profit
    );


  const buyPrice =
    Number(
      contract.buy_price
    ) || 0;


  const sellPrice =
    Number(
      contract.sell_price
    ) || 0;


  const profit =
    Number.isFinite(
      profitValue
    )
      ? profitValue
      : sellPrice - buyPrice;


  sessionPL +=
    profit;


  updateStats();


  const won =
    profit > 0;


  if (won) {

    log(
      "WIN | +" +
      money(profit) +
      " | Session P/L: $" +
      money(sessionPL)
    );


    recoveryMode =
      false;


    currentStake =
      config.initialStake;


    if (
      sessionPL >=
      config.takeProfit
    ) {

      log(
        "TAKE PROFIT REACHED: +$" +
        money(sessionPL)
      );

      stopBot();

      return;
    }


  } else {

    log(
      "LOSS | -" +
      money(Math.abs(profit)) +
      " | Session P/L: $" +
      money(sessionPL)
    );


    if (
      sessionPL <=
      -config.stopLoss
    ) {

      log(
        "STOP LOSS REACHED."
      );

      stopBot();

      return;
    }


    /*
      Determine the actual payout ratio
      from the proposal/contract data.
    */

    const payout =
      Number(
        contract.payout
      );


    let payoutRatio =
      0;


    if (
      Number.isFinite(payout) &&
      payout > buyPrice &&
      buyPrice > 0
    ) {

      payoutRatio =
        (
          payout -
          buyPrice
        ) /
        buyPrice;

    } else {

      /*
        Some responses may not include payout.
        Fall back to profit/sell data where possible.
      */

      if (
        sellPrice > buyPrice &&
        buyPrice > 0
      ) {

        payoutRatio =
          (
            sellPrice -
            buyPrice
          ) /
          buyPrice;
      }
    }


    if (
      payoutRatio <= 0
    ) {

      log(
        "Unable to calculate a valid payout ratio."
      );

      log(
        "Recovery blocked. Bot stopped safely."
      );

      stopBot();

      return;
    }


    const deficit =
      Math.max(
        0,
        -sessionPL
      );


    const requiredProfit =
      deficit +
      config.takeProfit;


    const requiredRecoveryStake =
      requiredProfit /
      payoutRatio;


    log(
      "Calculated recovery needed: $" +
      money(requiredRecoveryStake)
    );


    /*
      Maximum recovery stake.
    */

    if (
      requiredRecoveryStake >
      config.maxRecovery
    ) {

      log(
        "Recovery needed exceeds max recovery of $" +
        money(config.maxRecovery)
      );

      log(
        "Bot stopped safely."
      );

      stopBot();

      return;
    }


    /*
      Remaining session loss budget.
    */

    const remainingLossBudget =
      config.stopLoss +
      sessionPL;


    if (
      requiredRecoveryStake >
      remainingLossBudget
    ) {

      log(
        "Recovery would exceed remaining stop-loss budget."
      );

      log(
        "Bot stopped safely."
      );

      stopBot();

      return;
    }


    currentStake =
      Math.max(
        MIN_STAKE,
        requiredRecoveryStake
      );


    recoveryMode =
      true;


    log(
      "RECOVERY APPROVED | Stake $" +
      money(currentStake)
    );
  }


  if (
    sessionPL >=
    config.takeProfit
  ) {

    log(
      "TAKE PROFIT REACHED: +$" +
      money(sessionPL)
    );

    stopBot();

    return;
  }


  if (
    sessionPL <=
    -config.stopLoss
  ) {

    log(
      "STOP LOSS REACHED: -$" +
      money(Math.abs(sessionPL))
    );

    stopBot();

    return;
  }


  /*
    Give Deriv a short gap before requesting
    the next proposal.
  */

  setTimeout(
    () => {

      if (
        running &&
        !waitingForResult
      ) {

        requestProposal();
      }

    },
    700
  );
}


/* STOP BOT */

function stopBot(
  closeConnection = true
) {

  running =
    false;

  waitingForResult =
    false;

  startBtn.disabled =
    !connected;

  stopBtn.disabled =
    true;


  if (
    closeConnection &&
    ws
  ) {

    try {

      ws.close();

    } catch (error) {}
  }


  ws = null;


  log(
    "BOT STOPPED."
  );
}


/* BUTTON EVENTS */

/*
  THIS WAS THE MISSING PART
  IN THE PREVIOUS VERSION.
*/

connectBtn.onclick =
  connectDeriv;

startBtn.onclick =
  startBot;

stopBtn.onclick =
  () => {

    log(
      "Manual stop requested."
    );

    stopBot();
  };


/* INITIAL CHECK */

checkConnection();


/*
  Check silently every 15 seconds.
  It no longer floods the log.
*/

connectionCheckTimer =
  setInterval(
    checkConnection,
    15000
  );

</script>

</body>
</html>
