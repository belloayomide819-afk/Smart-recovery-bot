<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Recovery Bot</title>
</head>
<body>
  <h1>Smart Recovery Bot</h1>
  <p>Deriv Trading Bot</p>

  <label>Initial Stake ($)</label><br>
  <input id="stake" type="number" value="0.10" step="0.01"><br><br>

  <label>Take Profit ($)</label><br>
  <input id="tp" type="number" value="0.04" step="0.01"><br><br>

  <label>Stop Loss ($)</label><br>
  <input id="sl" type="number" value="0.15" step="0.01"><br><br>

  <label>Martingale Multiplier</label><br>
  <input id="multiplier" type="number" value="1.0" step="0.1"><br><br>

  <button onclick="connectDeriv()">CONNECT DERIV</button>
<button>START BOT</button>
<button>STOP BOT</button>

  <p>Status: <b>Disconnected</b></p>
  <p>Balance: $0.00</p>
  <p>Profit/Loss: $0.00</p>
</body>
</html>

  window.location.href = "https://oauth.deriv.com/oauth2/authorize?app_id=34hHdgalUQxRYo0jE6Qp";
